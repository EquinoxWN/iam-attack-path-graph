name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make ci
      - name: Lab account summary (annotation)
        run: |
          iamgraph perms examples/lab-snapshot.json | tee perms.txt
          echo "::notice title=iamgraph lab account::$(tail -n 1 perms.txt)"
      - name: Evaluation benchmark (annotation)
        run: |
          iamgraph bench --users 1000 --roles 500 | tee bench.json
          python3 -c "import json; d=json.load(open('bench.json')); print('::notice title=iamgraph bench::%d evaluations in %.2f s (%d/s)' % (d['evaluations'], d['evaluate_seconds'], d['evaluations_per_second']))"
      - name: Known-vulnerability audit
        run: make audit
